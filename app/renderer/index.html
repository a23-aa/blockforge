<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>BlockForge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="drag"></div>
    <div class="tb-btns">
      <button data-win="min" title="Свернуть"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button data-win="max" title="Развернуть"><svg class="ic" viewBox="0 0 24 24"><rect x="5.500" y="5.500" width="13" height="13" rx="2"/></svg></button>
      <button data-win="close" class="close" title="Закрыть"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <aside class="sidebar">
      <div class="brand"><img src="logo.svg" alt=""><span>BlockForge</span></div>
      <nav>
        <button class="nav-item active" data-page="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Главная</button>
        <button class="nav-item" data-page="play"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>Играть</button>
        <button class="nav-item" data-page="mods"><svg viewBox="0 0 24 24"><path d="M10 3h4v3a2 2 0 104 0h3v4h-3a2 2 0 100 4h3v4h-4v-3a2 2 0 10-4 0v3H6v-4a2 2 0 100-4V7h4z"/></svg>Моды</button>
        <button class="nav-item" data-page="skins"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11a2.800 2.800 0 00-4-4L4 15z"/><path d="M13 6l4 4"/></svg>Скины</button>
        <button class="nav-item" data-page="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c0-3.600 2.900-6 6.500-6s6.500 2.400 6.500 6"/><path d="M16 4.500a3.500 3.500 0 010 7M18 14.500c2.200.7 3.500 2.600 3.500 5.500"/></svg>Друзья</button>
        <button class="nav-item" data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Настройки</button>
      </nav>
      <div class="grow"></div>
      <div class="profile" id="profile" data-page="accounts"></div>
    </aside>

    <main id="view"></main>
  </div>

  <div id="modal" class="modal hidden"></div>
  <div id="toasts"></div>

  <script src="icons.js"></script>
  <script src="scenes.js"></script>
  <script src="islands.js"></script>
  <script src="app.js"></script>
  <script src="skinpack.js"></script>
  <script src="skins.js"></script>
  <script src="extra.js"></script>
  <script src="nav.js"></script>
  <script src="premium.js"></script>
  <script src="welcome.js"></script>
  <script src="i18n-en.js"></script>
  <script src="i18n.js"></script>
</body>
</html>
